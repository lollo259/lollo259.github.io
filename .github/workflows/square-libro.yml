name: Rebuild the book (square)
on:
  push:
    branches: [main]
    paths: ['square/capitoli/**', 'square/tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: square-libro, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node square/tools/build-libro.mjs
      - name: Commit libro.json if changed
        run: |
          git config user.name "square-bot"
          git config user.email "square-bot@users.noreply.github.com"
          git add square/libro.json
          git diff --cached --quiet || (git commit -m "Rebuild square/libro.json" && git push)
