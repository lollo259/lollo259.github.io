<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>Il Quadrante delle Emozioni</title>
<link rel="icon" href="/favicon.svg">
<style>
/* the book: 8.5 × 8.5 in pages, Inter, black and white */
@font-face { font-family: Inter; src: url(font/Inter.ttf); font-weight: 100 900; font-style: normal; }
@font-face { font-family: Inter; src: url(font/Inter-Italic.ttf); font-weight: 100 900; font-style: italic; }
:root {
  --ink: #141414; --grey: #8a8a8a; --rule: #cfcfcf; --paper: #fff; --desk: #e8e6e3; --ui: #1b1b1b;
  --pw: 816px; --ph: 816px;            /* 8.5 in at 96 px per inch */
  --top: 96px; --bottom: 96px; --inner: 48px; --outer: 56px;   /* inner ≥ 0.375 in for KDP binding */
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; }

/* ---------- interface */
.barra { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px max(16px, env(safe-area-inset-left)); background: var(--desk); border-bottom: 1px solid #d6d3cf; font-size: 13px; letter-spacing: .02em; }
.barra .t { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-right: auto; }
.barra button, .barra a { font: inherit; color: var(--ui); background: none; border: 1px solid #bdb9b4; border-radius: 999px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
.barra button:hover, .barra a:hover { background: #fff; }
.barra .info { color: #6b6762; }
.barra .avviso { display: block; color: #a3261b; font-weight: 500; }
.barra select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #bdb9b4; background: #fff; }
#stato { padding: 40px 16px; text-align: center; color: #6b6762; font-size: 14px; }
.libro { padding: 24px 16px 80px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
/* pages are laid out at full size and then scaled like a picture, so the screen always matches the print */
.spread { flex: none; width: calc(var(--n, 2) * var(--pw) * var(--z, 1)); height: calc(var(--ph) * var(--z, 1)); }
.spread .fogli { display: flex; width: max-content; transform: scale(var(--z, 1)); transform-origin: 0 0; }
.spread .page { box-shadow: 0 6px 24px rgba(0,0,0,.14); }
.spread .vuoto { width: var(--pw); height: var(--ph); }
.libro.singole .spread { --n: 1; }

/* ---------- the page */
.page { position: relative; width: var(--pw); height: var(--ph); background: var(--paper); overflow: hidden; flex: none; }
.page .area { position: absolute; top: var(--top); bottom: var(--bottom); overflow: hidden; }
.page.dx .area { left: var(--inner); right: var(--outer); }
.page.sx .area { left: var(--outer); right: var(--inner); }
.page .testata { position: absolute; top: 44px; font-size: 10px; color: var(--grey); }
.page.sx .testata { left: var(--outer); } .page.dx .testata { right: var(--outer); }
.page .folio { position: absolute; bottom: 42px; font-size: 10px; font-weight: 500; }
.page.sx .folio { left: var(--outer); } .page.dx .folio { right: var(--outer); }

/* text: two columns on every text page */
.area { font-size: 11.6px; line-height: 1.56; hyphens: manual; }
.page.testo .area { column-count: 2; column-gap: 48px; column-fill: auto; }
.area p { margin: 0 0 .75em; orphans: 2; widows: 2; }
.area h1 { font-weight: 300; font-size: 25px; line-height: 1.15; letter-spacing: -.01em; margin: 0 0 .9em; }
.area h2 { font-weight: 300; font-size: 25px; line-height: 1.15; letter-spacing: -.01em; margin: 1.3em 0 .7em; break-after: avoid; }
.area h3 { font-weight: 600; font-size: 11.6px; line-height: 1.56; margin: 1.6em 0 .2em; break-after: avoid; }
.area h3 + h3 { margin-top: 0; font-weight: 400; color: #777; }
.area h4 { font-weight: 500; font-size: 11.6px; margin: 1.2em 0 .3em; }
.area > :first-child { margin-top: 0; }
.area ul, .area ol { margin: 0 0 .75em; padding-left: 1.3em; }
.area li { margin: 0 0 .2em; }
.area ul ul { margin-top: .2em; font-size: .94em; }
.area blockquote { margin: 0 0 .8em 1.1em; font-size: .94em; }
.area blockquote p { margin: 0 0 .4em; }
.area hr { border: 0; margin: .6em 0; text-align: center; }
.area hr::after { content: "·"; }
.area img { max-width: 100%; }
.area a { color: inherit; }
.area .epi { font-style: italic; font-size: 10.5px; color: #555; margin: 0 0 .1em; }
.parola h2 { margin-top: 0; }
.fine p, .fine li { font-size: 11px; }
.note h3 { font-weight: 500; font-size: 11.6px; margin: 1.2em 0 .3em; }

/* chapter openings: 4⁰ 4¹ 4² 4³, each in its own quarter of the page */
.page.apertura { background: #000; color: #fff; }
.page .qq, .page .sq { position: absolute; width: 50%; height: 50%; }
.page .qq { padding: 56px; }
.page .sq { padding: 44px; background: #000; color: #fff; }
.page .sq.bianco { background: #fff; color: var(--ink); }
.page .num { font-weight: 200; font-size: 110px; line-height: 1; letter-spacing: -.03em; }
.page .num sup { font-size: .42em; vertical-align: .95em; margin-left: .04em; }
.page .qq .t, .page .sq .t { font-weight: 300; font-size: 27px; line-height: 1.18; max-width: 290px; margin-top: 22px; }
.page.splash img, .page.doppia img { position: absolute; top: 0; height: 100%; width: 200%; object-fit: cover; }
.page.splash.sx img, .page.doppia.sx img { left: 0; } .page.splash.dx img, .page.doppia.dx img { left: -100%; }

/* other pages */
.page.frontespizio .area, .page.dedica .area, .page.colophon .area { display: flex; flex-direction: column; justify-content: center; }
.page.frontespizio h1 { font-weight: 200; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; margin: 0 0 .4em; }
.page.frontespizio p { font-size: 13px; }
.page.dedica .area { display: block !important; padding-top: 275px; font-size: 13px; }
.page.dedica h1 { font-weight: 300; font-size: 27px; margin: 0 0 .5em; }
.page.dedica h1 + p:has(> em:only-child) { color: var(--grey); font-size: 12px; margin: 0 0 2.6em; }   /* a grey subtitle only when the line is all italic */
.page.dedica p { margin: 0 0 .1em; }
.page.colophon .area { justify-content: flex-end; font-size: 9.5px; }
.page.colophon .area p { margin: 0 0 .35em; }
.page.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.page.figura .area, .page.disegno .area { display: flex; flex-direction: column; justify-content: center; align-items: center; }
.page.figura img, .page.disegno img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.page.figura .fig { align-self: flex-start; font-size: 10px; color: var(--grey); margin: 0 0 4px; }
.page img.fondo { position: absolute; left: 0; width: 100%; }
.page.figpiena img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

/* contents: general on the left page, the four chapters on the right, each quarter the colour of its opening */
.page.indice h1 { position: absolute; left: var(--outer); top: 56px; font-weight: 300; font-size: 25px; margin: 0; }
.page.indice .gen { position: absolute; left: var(--outer); bottom: 56px; width: 300px; font-size: 12.5px; }
.page.indice .q { position: absolute; width: 50%; height: 50%; background: #000; color: #fff; padding: 48px; }
.page.indice .q.bianco { background: #fff; color: var(--ink); }
.page.indice .q .num { font-size: 58px; margin: 0 0 12px; }
.page.indice .r { display: flex; align-items: baseline; gap: 12px; }
.page.indice .r .p { margin-left: auto; font-variant-numeric: tabular-nums; }
.page.indice .gen .r { margin: 0 0 8px; }
.page.indice .q .c { font-size: 15px; margin: 0 0 10px; }
.page.indice .q .s { font-size: 11.5px; margin: 0 0 4px; color: #c4c4c4; }
.page.indice .q .s2 { font-size: 11px; margin: 0 0 4px; padding-left: 16px; color: #a8a8a8; }
.page.indice .q.bianco .s { color: #666; } .page.indice .q.bianco .s2 { color: #8a8a8a; }
.page.indice a { color: inherit; text-decoration: none; }

/* measuring box */
#misura { position: absolute; left: -10000px; top: 0; }

@media print {
  @page { size: 8.5in 8.5in; margin: 0; }
  body { background: #fff; }
  .barra, #stato { display: none !important; }
  .libro { padding: 0; gap: 0; display: block; }
  .spread { display: block; width: auto; height: auto; }
  .spread .fogli { display: block; transform: none; }
  .spread .vuoto { display: none; }
  .spread .page { box-shadow: none; break-after: page; }
  .spread .page.ultima { break-after: auto; }
}
</style>
</head>
<body>
<div class="barra">
  <span class="t">Il Quadrante delle Emozioni</span>
  <span class="info" id="info"></span>
  <select id="vista" aria-label="Vista">
    <option value="doppie">Pagine affiancate</option>
    <option value="singole">Una pagina alla volta</option>
  </select>
  <button id="pdf" type="button">Scarica PDF</button>
  <button id="modifica" type="button">Modifica</button>
</div>
<div id="stato">Impagino il libro…</div>
<div class="libro" id="libro"></div>
<div id="misura"></div>
<div id="editor" hidden></div>

<script>
'use strict';
// ------------------------------------------------------------------ a small Markdown renderer (the subset Pages CMS writes)
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  // keep raw inline HTML that the editor may write (<em>, <strong>, <br>, <span …>)
  const keep = []; s = s.replace(/<\/?(em|strong|i|b|br|span|sup|sub|u|s)( [^>]*)?\/?>/gi, m => (keep.push(m), `\u0000${keep.length - 1}\u0000`));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, a, u) => `<img src="${u}" alt="${a}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, u) => `<a href="${u}">${t}</a>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_(?!\s)([^_]+?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\\\n/g, '<br>').replace(/ {2,}\n/g, '<br>').replace(/\\([\\`*_{}\[\]()#+\-.!>])/g, '$1');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[i]);
}
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const isBlank = l => !l.trim();
  while (i < lines.length) {
    let l = lines[i];
    if (isBlank(l)) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2].trim())}</h${n}>`; i++; continue; }
    if (/^\s*([*_-])(\s*\1){2,}\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^\s*<(p|div|figure|table|blockquote|ul|ol|h\d)[\s>]/i.test(l)) {      // raw HTML block
      let b = ''; while (i < lines.length && !isBlank(lines[i])) b += lines[i++] + '\n'; out += b; continue;
    }
    if (/^\s*>/.test(l)) {
      let b = []; while (i < lines.length && /^\s*>/.test(lines[i])) b.push(lines[i++].replace(/^\s*>\s?/, ''));
      out += `<blockquote>${markdown(b.join('\n'))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const items = []; let cur = null;
      while (i < lines.length && !isBlank(lines[i])) {
        const x = lines[i], mm = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (mm && mm[1].length < 2) { cur = { t: mm[3], sub: [], ord: /\d/.test(mm[2]) }; items.push(cur); }
        else if (cur && mm) cur.sub.push(x.replace(/^\s{2,4}/, ''));
        else if (cur) cur.t += '\n' + x.trim();
        i++;
        if (i < lines.length && isBlank(lines[i]) && i + 1 < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i + 1])) i++;
      }
      const tag = items[0].ord ? 'ol' : 'ul';
      out += `<${tag}>` + items.map(it => `<li>${inline(it.t)}${it.sub.length ? markdown(it.sub.join('\n')) : ''}</li>`).join('') + `</${tag}>`;
      continue;
    }
    let p = []; while (i < lines.length && !isBlank(lines[i]) && !/^(#{1,6}\s|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) p.push(lines[i++]);
    if (!p.length) { p.push(lines[i++]); }
    const txt = p.join('\n');
    if (/^!\[[^\]]*\]\([^)]+\)$/.test(txt.trim())) out += `<figure>${inline(txt.trim())}</figure>`;
    else out += `<p>${inline(txt)}</p>`;
  }
  return out;
}

// ------------------------------------------------------------------ pagination
const BOOK = 'Il quadrante delle emozioni';
const misura = document.getElementById('misura');
let pages = [];                        // {el, kind, cap, folio:boolean, head:boolean}
function newPage(kind, cap, opts = {}) {
  const el = document.createElement('div');
  el.className = 'page ' + kind;
  const p = { el, kind, cap: cap || '', folio: opts.folio !== false, head: opts.head !== false, cls: opts.cls || '' };
  if (opts.area !== false) { const a = document.createElement('div'); a.className = 'area ' + p.cls; el.appendChild(a); p.area = a; }
  pages.push(p); misura.appendChild(el); side(p);
  return p;
}
function side(p) {                     // page 1 is a right-hand page
  const n = pages.indexOf(p) + 1;
  p.el.classList.toggle('dx', n % 2 === 1); p.el.classList.toggle('sx', n % 2 === 0);
}
const overflows = a => a.scrollHeight > a.clientHeight + 0.5 || a.scrollWidth > a.clientWidth + 0.5;   // columns overflow sideways

// split an element so that its first part fits in the area; returns the remainder (or null)
function splitToFit(el, area) {
  if (!overflows(area)) return null;
  const tag = el.tagName;
  if (tag === 'UL' || tag === 'OL' || tag === 'BLOCKQUOTE') {
    const rest = el.cloneNode(false);
    while (overflows(area) && el.lastElementChild) rest.insertBefore(el.lastElementChild, rest.firstChild);
    if (!el.firstElementChild) { el.remove(); return rest; }                  // nothing fits
    // try to put part of the first moved child back
    const first = rest.firstElementChild;
    if (first && /^(LI|P)$/.test(first.tagName)) {
      el.appendChild(first);
      const r2 = splitToFit(first, area);
      if (r2 === first) { rest.insertBefore(first, rest.firstChild); }
      else if (r2) { rest.insertBefore(r2, rest.firstChild); }
    }
    if (tag === 'OL') rest.setAttribute('start', (+(el.getAttribute('start') || 1)) + el.children.length);
    return rest.childNodes.length ? rest : null;
  }
  if (!/^(P|LI)$/.test(tag)) { el.remove(); return el; }                       // headings, figures: move whole
  // the whitespace positions of the element, in document order (recomputed after every trial)
  const count = () => { const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const ps = []; let x;
    while ((x = w.nextNode())) { const re = /\s+/g; let m; while ((m = re.exec(x.data))) ps.push([x, m.index]); } return ps; };
  const fits = k => {                  // does the text before whitespace k fit?
    const ps = count(); const r = document.createRange(); r.setStart(ps[k][0], ps[k][1]); r.setEndAfter(el.lastChild);
    const frag = r.extractContents(); const ok = !overflows(area); el.appendChild(frag); el.normalize();
    return ok;
  };
  const N = count().length;
  if (!N) { el.remove(); return el; }
  let lo = -1, hi = N - 1;
  while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (fits(mid)) lo = mid; else hi = mid - 1; }
  const ps = count();
  if (lo < 1) { el.remove(); return el; }                                      // fewer than two words fit: move it
  // keep at least two lines on each side (simple widow/orphan control by words)
  const r = document.createRange(); r.setStart(ps[lo][0], ps[lo][1]); r.setEndAfter(el.lastChild);
  const frag = r.extractContents();
  const rest = el.cloneNode(false); rest.appendChild(frag); rest.classList.add('segue');
  // trim the leading space of the remainder
  const fw = document.createTreeWalker(rest, NodeFilter.SHOW_TEXT).nextNode(); if (fw) fw.data = fw.data.replace(/^\s+/, '');
  if (tag === 'LI') rest.style.listStyle = 'none';
  return rest;
}

// a part that ends on a left-hand page with an image under its last lines (the river under the last answers)
function trimTo(area) {                 // take out what does not fit, keeping the order
  const rest = [];
  while (overflows(area) && area.lastElementChild) { rest.unshift(area.lastElementChild); area.lastElementChild.remove(); }
  if (rest.length) { const b = rest.shift(); area.appendChild(b); const r = splitToFit(b, area); if (r === b) rest.unshift(b); else if (r) rest.unshift(r); }
  return rest;
}
function closeOnLeft(x, cap, cls) {
  // the last lines of the part sit on a left-hand page, the image under them; if they do not fit above it,
  // the image takes the next left-hand page on its own (the text can be adjusted in the editor)
  const top = +x.fondo_da || 471;
  const place = p => { p.flow = false; p.folio = false; p.fondo = true;
    p.el.insertAdjacentHTML('beforeend', `<img class="fondo" src="${x.immagine_fondo}" alt="" style="top:${top}px">`); };
  let p = pages[pages.length - 1];
  if (pages.length % 2 === 0 && p.flow) {
    p.area.style.bottom = (816 - top + 12) + 'px';
    if (!overflows(p.area)) return place(p);
    p.area.style.bottom = '';
  }
  if (pages.length % 2 === 0) blank(cap);
  p = newPage('testo', cap, { cls }); p.area.style.bottom = (816 - top + 12) + 'px'; place(p);
}

let pending = [];                      // image pages waiting for the current text page to fill
function flushPending(hard) {
  const keep = [];
  for (const job of pending) {
    if (job.left && pages.length % 2 === 0) {                 // a spread must start on a left-hand page
      if (hard) { blank(); job.make(); } else keep.push(job);
    } else job.make();
  }
  pending = keep;
}
function lastFlow(cls) { const q = pages[pages.length - 1]; return q && q.flow && q.cls === cls ? q : null; }
function flowText(blocks, kind, cap, cls, startNew) {
  if (startNew) flushPending(true);
  let p = startNew ? null : lastFlow(cls);
  if (!p) { flushPending(true); p = newPage('testo', cap, { cls }); p.flow = true; }
  const queue = [...blocks];
  while (queue.length) {
    const b = queue.shift();
    p.area.appendChild(b);
    if (!overflows(p.area)) { if (b.tagName && /^H[2-6]$/.test(b.tagName)) b.dataset.cap = cap; continue; }
    // a heading at the bottom moves with the next block
    const rest = splitToFit(b, p.area);
    const last = p.area.lastElementChild;
    const carry = [];
    if (last && /^H[1-6]$/.test(last.tagName)) carry.push(last);
    carry.forEach(x => x.remove());
    flushPending(false);
    p = newPage('testo', cap, { cls }); p.flow = true;
    carry.forEach(x => p.area.appendChild(x));
    if (rest) queue.unshift(rest);
  }
  return p;
}

function blank(cap) { const p = newPage('vuota', cap, { area: false, folio: false, head: false }); return p; }
function toRight() { if (pages.length % 2 === 1) blank(); }    // next page will be odd
function toLeft() { if (pages.length % 2 === 0) blank(); }     // next page will be even

let figN = 0, idxEntries = [], idxSpec = '';
function place(x, tipo, cap, html) {
    if (tipo === 'apertura') {
      // chapter n is 4^(n-1) and sits in quarter n: 1 top left, 2 top right, 3 bottom left, 4 bottom right
      const n = parseInt(x.numero, 10), q = isNaN(n) ? 0 : (n - 1) % 4;
      const num = isNaN(n) ? esc(String(x.numero || '')) : `4<sup>${n - 1}</sup>`;
      const pos = `left:${(q % 2) * 50}%;top:${Math.floor(q / 2) * 50}%`;
      const block = `<div class="num">${num}</div><div class="t">${esc(x.titolo || '')}</div>`;
      // fixed starts: chapter n opens on the spread whose left page is 4^(n-1) (4, 16, 64); chapter 1 on page 1
      const s0 = pages.findIndex(q => q.capStart);
      if (!isNaN(n) && n >= 2 && s0 >= 0) {
        const L = s0 + Math.pow(4, n - 1) - 1;                   // index of the left page of the opening spread
        const SUP = ['⁰', '¹', '²', '³', '⁴'], over = pages.length - L;
        if (over > 0) avvisi.push(`4${SUP[n - 2]} ha ${over} ${over === 1 ? 'pagina' : 'pagine'} di troppo: 4${SUP[n - 1]} dovrebbe aprirsi a pagina ${Math.pow(4, n - 1)}`);
        while (pages.length < L) blank(cap);
      }
      let p;
      if (x.immagine && x.splash === true) {          // one image across the spread, a square on it
        toLeft();
        const a = newPage('splash', cap, { folio: false, head: false, area: false }); a.el.innerHTML = `<img src="${x.immagine}" alt="">`;
        p = newPage('splash', cap, { folio: false, head: false, area: false });
        p.el.innerHTML = `<img src="${x.immagine}" alt=""><div class="sq${x.bianco === true ? ' bianco' : ''}" style="${pos}">${block}</div>`;
      } else {
        if (x.immagine) { toLeft(); const a = newPage('foto', cap, { folio: false, head: false, area: false }); a.el.innerHTML = `<img src="${x.immagine}" alt="">`; }
        else toRight();
        p = newPage('apertura', cap, { folio: false, head: false, area: false });
        p.el.innerHTML = `<div class="qq" style="${pos}">${block}</div>`;
      }
      p.capStart = true; p.apTitle = x.titolo || ''; p.apNum = isNaN(n) ? x.numero : n; p.apQuarter = q; p.apWhite = x.bianco === true && x.splash === true;
      return true;
    }
    if (tipo === 'frontespizio' || tipo === 'dedica' || tipo === 'colophon') {
      const p = newPage(tipo, '', { folio: false, head: false }); p.area.innerHTML = html; return true;
    }
    if (tipo === 'indice') {                          // a spread: general on the left, the chapters on the right
      toLeft();
      const a = newPage('indice', '', { folio: false, head: false, area: false }); a.isIndex = true;
      const b = newPage('indice', '', { folio: false, head: false, area: false }); b.isIndexQ = true;
      idxSpec = x.body || ''; return true;
    }
    if (tipo === 'foto') {
      const p = newPage('foto', cap, { area: false, folio: false, head: false });
      p.el.innerHTML = `<img src="${x.immagine}" alt="">`; return true;
    }
    if (tipo === 'doppia' || tipo === 'doppia-figura') {
      toLeft();
      const a = newPage(tipo === 'doppia' ? 'doppia' : 'figpiena', cap, { area: false, folio: false, head: false });
      const b = newPage(tipo === 'doppia' ? 'doppia' : 'figpiena', cap, { area: false, folio: false, head: false });
      if (tipo === 'doppia') { a.el.innerHTML = b.el.innerHTML = `<img src="${x.immagine}" alt="">`; }
      else { a.el.innerHTML = `<img src="${x.immagine}" alt="">`; b.el.innerHTML = `<img src="${x.immagine_destra || x.immagine}" alt="">`; }
      return true;
    }
    if (tipo === 'figura' && x.pagina_intera === true) {
      const quiet = x.senza_testata === true;
      const p = newPage('figpiena', cap, { area: false, folio: !quiet, head: !quiet });
      p.el.innerHTML = `<img src="${x.immagine}" alt="${esc(x.titolo || '')}">`;
      p.idxTitle = x.titolo; return true;
    }
    if (tipo === 'figura' || tipo === 'disegno') {
      const p = newPage(tipo, cap);
      if (tipo === 'figura') { p.area.innerHTML = `<div class="fig">fig. ${x._fig}</div><img src="${x.immagine}" alt="${esc(x.titolo || '')}">`; }
      else p.area.innerHTML = `<img src="${x.immagine}" alt="${esc(x.titolo || '')}">`;
      if (html) { const d = document.createElement('div'); d.innerHTML = html; p.area.appendChild(d); }
      return true;
    }
    return false;
}

let pageOf = {};                       // part (editor id) -> index of its first page
function mark(x, n) { if (x._pid !== undefined) pageOf[x._pid] = Math.min(n, pages.length - 1); }
const NOIMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#eeeeee"/><text x="200" y="205" font-family="sans-serif" font-size="16" fill="#999" text-anchor="middle">immagine da scegliere</text></svg>');
let avvisi = [];
function render(parti) {
  avvisi = [];
  parti = parti.map(x => (/^(foto|doppia|figura|disegno|doppia-figura)$/.test(x.tipo) && !x.immagine) ? { ...x, immagine: NOIMG } : x);
  pageOf = {}; Q.pageOf = pageOf;
  pages = []; misura.innerHTML = ''; figN = 0; idxEntries = []; pending = []; idxSpec = '';
  const floating = x => (x.tipo === 'foto' || x.tipo === 'figura' || x.tipo === 'doppia' || x.tipo === 'disegno') && x.fluttua !== false;
  for (const x of parti) {
    const tipo = x.tipo || 'testo', cap = x.capitolo || '';
    const html = markdown(x.body || '');
    const prev = pages[pages.length - 1];
    if (floating(x) && prev && prev.flow && !x.lato) {    // wait for the text page to fill
      if (tipo === 'figura') x._fig = ++figN;
      pending.push({ left: tipo === 'doppia', make: () => { const n = pages.length; place(x, tipo, cap, html); mark(x, n); } });
      continue;
    }
    if (tipo !== 'testo' || x.nuova_pagina === true) flushPending(true);
    if (x.lato === 'destra') toRight(); else if (x.lato === 'sinistra') toLeft();
    if (tipo === 'figura') x._fig = ++figN;
    { const n = pages.length; if (place(x, tipo, cap, html)) { mark(x, n); continue; } }
    // text
    const cls = [cap === 'La parola dell’artista' ? 'parola' : '', /Glossario|Note/.test(cap) ? 'fine' : '', /Note/.test(cap) ? 'note' : ''].join(' ').trim();
    const holder = document.createElement('div'); holder.innerHTML = html;
    // an italic first paragraph followed by a heading is an epithet (il Nomade, il Monaco…)
    const kids = [...holder.children];
    kids.forEach((k, i) => { if (k.tagName === 'P' && /^<em>[^<]+<\/em>$|^\[<em>[^<]+<\/em>\]$/.test(k.innerHTML.trim()) && kids[i + 1] && kids[i + 1].tagName === 'H2') k.classList.add('epi'); });
    kids.forEach(k => { if (/^H[1-4]$/.test(k.tagName) && k.textContent.length > 2 && k.textContent === k.textContent.toUpperCase() && /[A-Z]/.test(k.textContent)) { const t = k.textContent.toLowerCase(); k.textContent = t[0].toUpperCase() + t.slice(1); } });
    kids.forEach(k => { if (/^H1$/.test(k.tagName) || (x.nell_indice !== false && /^H[23]$/.test(k.tagName))) k.dataset.idx = k.tagName; });
    const startNew = x.nuova_pagina === true;
    flowText(kids, 'testo', cap, cls, startNew);
    if (x.immagine_fondo) closeOnLeft(x, cap, cls);
    if (x._pid !== undefined) { const pe = kids[0] && kids[0].closest('.page'); pageOf[x._pid] = pe ? pages.findIndex(q => q.el === pe) : pages.length - 1; }
  }
  flushPending(true);
  // heads, folios, index
  const start = pages.findIndex(p => p.capStart);
  pages.forEach((p, i) => {
    side(p);
    const n = i + 1, f = start >= 0 && i >= start ? i - start + 1 : null; p.n = f;
    if (p.head && f && p.kind !== 'vuota') {
      const t = document.createElement('div'); t.className = 'testata';
      t.textContent = n % 2 === 0 ? BOOK : (p.cap || BOOK); p.el.appendChild(t);
    }
    if (p.folio && f && p.kind !== 'vuota') { const d = document.createElement('div'); d.className = 'folio'; d.textContent = f; p.el.appendChild(d); }
  });
  // index entries from headings
  pages.forEach(p => p.area && p.area.querySelectorAll('[data-idx]').forEach(h => {
    if (h.classList.contains('segue')) return;
    const lv = h.dataset.idx === 'H1' ? 'b' : h.dataset.idx === 'H2' ? 's' : 's2';
    idxEntries.push({ lv, t: h.textContent, page: p });
  }));
  idxEntries.sort((a, b) => pages.indexOf(a.page) - pages.indexOf(b.page));
  const voci = (idxSpec.match(/^\s*[-*]\s+.+$/gm) || []).map(l => ({ lv: (l.match(/^\s*/)[0].length >> 1), t: l.replace(/^\s*[-*]\s+/, '').trim() }));
  if (voci.length) {
    const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[*_]/g, '').replace(/\s+/g, ' ').trim();
    const cand = [];
    pages.forEach(p => {
      if (p.apTitle !== undefined) cand.push({ t: p.apTitle, page: p, n: p.apNum, q: p.apQuarter, white: p.apWhite });
      if (p.area) p.area.querySelectorAll('h1,h2,h3,h4').forEach(h => { if (!h.classList.contains('segue')) cand.push({ t: h.textContent, page: p }); });
    });
    let k = 0; const found = [];
    for (const v of voci) {
      let j = cand.findIndex((c, i) => i >= k && norm(c.t) === norm(v.t));
      if (j < 0) j = cand.findIndex(c => norm(c.t) === norm(v.t));
      const c = j >= 0 ? cand[j] : null; if (j >= 0) k = j + 1;
      found.push({ lv: v.lv === 0 ? (c && c.n ? 'c' : 'b') : v.lv === 1 ? 's' : 's2', n: c && c.n, q: c && c.q, white: c && c.white, t: v.t, page: c ? c.page : { n: '' } });
    }
    idxEntries = found;
  }
  const ix = pages.find(p => p.isIndex), iq = pages.find(p => p.isIndexQ);
  if (ix && iq) {
    const gen = [], chaps = []; let cur = null;
    for (const e of idxEntries) {
      if (e.lv === 'c') { cur = { e, subs: [] }; chaps.push(cur); }
      else if (e.lv === 'b') { cur = null; gen.push(e); }
      else if (cur) cur.subs.push(e); else gen.push(e);
    }
    const row = (cls, t, p) => `<div class="r ${cls}"><span>${esc(t)}</span><span class="p">${p ?? ''}</span></div>`;
    ix.el.innerHTML = '<h1>Indice</h1><div class="gen">' + gen.map(e => row('', e.t, e.page.n)).join('') + '</div>';
    iq.el.innerHTML = chaps.map(({ e, subs }) => {
      const q = e.q ?? 0, n = parseInt(e.n, 10);
      return `<div class="q${e.white ? ' bianco' : ''}" style="left:${(q % 2) * 50}%;top:${Math.floor(q / 2) * 50}%">` +
        `<div class="num">${isNaN(n) ? esc(String(e.n)) : `4<sup>${n - 1}</sup>`}</div>` + row('c', e.t, e.page.n) +
        subs.map(s => row(s.lv, s.t, s.page.n)).join('') + '</div>';
    }).join('');
  }
  return pages;
}

// ------------------------------------------------------------------ show
function show() {
  const libro = document.getElementById('libro'); libro.innerHTML = '';
  const singole = document.getElementById('vista').value === 'singole';
  libro.classList.toggle('singole', singole);
  const els = pages.map(p => p.el);
  els.forEach((e, i) => e.classList.toggle('ultima', i === els.length - 1));
  const rows = [];
  if (singole) els.forEach(e => rows.push([e]));
  else { rows.push([null, els[0]]); for (let i = 1; i < els.length; i += 2) rows.push([els[i], els[i + 1] || null]); }
  for (const r of rows) {
    const s = document.createElement('div'); s.className = 'spread';
    const f = document.createElement('div'); f.className = 'fogli'; s.appendChild(f);
    r.forEach(e => { if (e) f.appendChild(e); else { const v = document.createElement('div'); v.className = 'vuoto'; f.appendChild(v); } });
    libro.appendChild(s);
  }
  fit();
}
function fit() {
  const singole = document.getElementById('vista').value === 'singole';
  const box = document.body.classList.contains('editing') ? document.getElementById('libro').clientWidth : window.innerWidth;
  const w = Math.min(box - 32, singole ? 900 : 1700);
  const z = Math.min(1, w / ((singole ? 1 : 2) * 816));
  document.documentElement.style.setProperty('--z', z.toFixed(3));
}
addEventListener('resize', fit);
document.getElementById('vista').addEventListener('change', show);
document.getElementById('pdf').addEventListener('click', () => window.print());

async function impagina(parti, generato) {
  Q.pageOf = {};
  render(parti);
  await Promise.all([...misura.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  show();
  const info = document.getElementById('info');
  info.textContent = `${pages.length} pagine` + (generato ? ` · aggiornato ${new Date(generato).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })}` : '');
  if (avvisi.length) info.insertAdjacentHTML('beforeend', avvisi.map(a => `<span class="avviso">${esc(a)}</span>`).join(''));
}
window.Q = { markdown, impagina, esc, show, fit, pages: () => pages };
async function avvia() {
  const stato = document.getElementById('stato');
  try {
    const r = await fetch('libro.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('libro.json: ' + r.status);
    const libro = await r.json();
    Q.libro = libro;
    await document.fonts.load('12px Inter'); await document.fonts.load('italic 12px Inter'); await document.fonts.load('200 12px Inter');
    await impagina(libro.parti, libro.generato);
    stato.remove();
    document.body.dataset.pronto = '1';
  } catch (e) {
    stato.textContent = 'Non riesco a caricare il libro: ' + e.message;
    console.error(e);
  }
}
avvia();
</script>
