<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>Quadrante delle emozioni</title>
<link rel="icon" href="/favicon.svg">
<style>
/* the book: 8.5 × 8.5 in pages, Inter, black and white */
@font-face { font-family: Inter; src: url(font/Inter.ttf); font-weight: 100 900; font-style: normal; }
@font-face { font-family: Inter; src: url(font/Inter-Italic.ttf); font-weight: 100 900; font-style: italic; }
:root {
  --ink: #141414; --grey: #8a8a8a; --rule: #cfcfcf; --paper: #fff; --desk: #e8e6e3; --ui: #1b1b1b;
  --pw: 816px; --ph: 816px;            /* 8.5 in at 96 px per inch */
  --top: 96px; --bottom: 96px; --inner: 48px; --outer: 56px;   /* inner ≥ 0.375 in for KDP binding */
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { color-scheme: only light; }
body { background: var(--desk); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; }

/* ---------- interface */
.barra { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px max(16px, env(safe-area-inset-left)); background: var(--desk); border-bottom: 1px solid #d6d3cf; font-size: 13px; letter-spacing: .02em; }
.barra .t { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-right: auto; }
.barra button, .barra a { font: inherit; color: var(--ui); background: none; border: 1px solid #bdb9b4; border-radius: 999px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
.barra button:hover, .barra a:hover { background: #fff; }
.barra .info { color: #6b6762; }
.barra .avviso { display: block; color: #a3261b; font-weight: 500; }
.barra select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #bdb9b4; background: #fff; }
#stato { padding: 40px 16px; text-align: center; color: #6b6762; font-size: 14px; }
.libro { padding: 24px 16px 80px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
/* pages are laid out at full size and then scaled like a picture, so the screen always matches the print */
.spread { flex: none; width: calc(var(--n, 2) * var(--pw) * var(--z, 1)); height: calc(var(--ph) * var(--z, 1)); }
.spread .fogli { display: flex; width: max-content; transform: scale(var(--z, 1)); transform-origin: 0 0; }
.spread .page { box-shadow: 0 6px 24px rgba(0,0,0,.14); }
.spread .vuoto { width: var(--pw); height: var(--ph); }
.libro.singole .spread { --n: 1; }

/* ---------- the page */
.page { position: relative; width: var(--pw); height: var(--ph); background: var(--paper); overflow: hidden; flex: none; }
.page .area { position: absolute; top: var(--top); bottom: var(--bottom); overflow: hidden; }
.page.dx .area { left: var(--inner); right: var(--outer); }
.page.sx .area { left: var(--outer); right: var(--inner); }
/* running head: small spaced capitals; folio at the bottom, outer side */
.page .testata { position: absolute; top: 48px; font-size: 12px; line-height: 21px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #777; }
.page.sx .testata { left: 72px; } .page.dx .testata { right: 72px; }
.page .folio { position: absolute; bottom: 46px; font-size: 12px; font-variant-numeric: lining-nums tabular-nums; font-weight: 500; white-space: nowrap; }
.page.sx .folio { left: 72px; } .page.dx .folio { right: 72px; }
.page .folio .ft { margin: 0 26px; }

/* text pages: one column pushed toward the fold, the outer margin is a column for subheadings, notes and numbers */
.area { font-size: 13.5px; line-height: 21px; hyphens: auto; -webkit-hyphens: auto; font-variant-numeric: oldstyle-nums proportional-nums; }
/* everything sits on a 21px grid: every block is a whole number of lines, spaces are whole lines */
.page.testo.dx .area { left: 88px; right: 72px; padding-right: 216px; }
.page.testo.sx .area { left: 72px; right: 88px; padding-left: 216px; }
.area p { margin: 0; orphans: 2; widows: 2; text-align: justify; text-indent: 1.4em; }
/* no indent at the start: after a heading, a rule, a figure, a list; continuations; questions and glossary entries */
.area h1 + p, .area h2 + p, .area h3 + p, .area h4 + p, .area hr + p, .area figure + p, .area img + p, .area ul + p, .area ol + p,
.area p.segue, .area p.q, .area p.q + p, .area p.g, .area p.epi, .area li p, .area blockquote p, .area p.sub { text-indent: 0; }
.area p + blockquote.m + p:not(.segue):not(.q):not(.g), .area p + blockquote.m + blockquote.m + p:not(.segue):not(.q):not(.g) { text-indent: 1.4em; }
.area > :first-child { margin-top: 0; }
.area ul, .area ol { margin: 0; padding-left: 1.3em; }
.area li { margin: 0; text-align: justify; }
.area ul ul { margin-top: 0; }
.area hr { border: 0; margin: 0; height: 21px; text-align: center; }
.area figure { margin: 0; }
/* drop cap, first paragraph of every essay: three lines of the grid, from the cap height of line 1 to the baseline of line 3 */
.area p.capo { text-indent: 0; }
.area p.capo::first-letter { float: left; font-weight: 800; font-size: 71.2px; line-height: 63px; height: 63px; margin: 0 8px 0 -1px; color: #000; font-variant-numeric: lining-nums; }
.area hr::after { content: "·"; }
.area img { max-width: 100%; }
.area a { color: inherit; }
/* in the margin column, at the height where they fall in the text */
.area .m { position: absolute; width: 190px; margin: 0; }
.page.dx .area .m { right: 0; } .page.sx .area .m { left: 0; }
.area h3.m { font-weight: 800; font-size: 20px; line-height: 21px; text-align: left; hyphens: manual; letter-spacing: -.02em; }
.area blockquote.m { font-size: 12px; line-height: 21px; font-style: italic; }
.area blockquote.m p { margin: 0; text-align: left; }
/* sub-chapters (the entries of the contents), Glossario, Note: bold, in the column */
.area h1, .area h2, .area h3.sotto { font-weight: 800; font-size: 44px; line-height: 42px; letter-spacing: -.03em; margin: 42px 0 21px; text-align: left; hyphens: manual; font-variant-numeric: lining-nums; }
.area > h1:first-child, .area > h2:first-child, .area > h3.sotto:first-child { margin-top: 0; }
/* sections: small spaced capitals */
.area h3.sez { font-weight: 600; font-size: 12px; line-height: 21px; letter-spacing: .22em; text-transform: uppercase; margin: 21px 0 0; }
.area h4 { font-weight: 700; font-size: 13.5px; line-height: 21px; margin: 21px 0 0; }
/* interviews: epithet and name, same size, same black, same bold */
.area .epi { font-weight: 800; font-size: 44px; line-height: 42px; text-align: left; letter-spacing: -.03em; color: var(--ink); margin: 0; }
.area .epi em { font-style: normal; }
.area .epi + h2 { margin-top: 0; }
.area p.q { position: relative; font-weight: 700; margin-top: 21px; }
.area p.q em { font-style: normal; }
.area .qn, .area .gt { position: absolute; width: 190px; font-weight: 800; font-size: 20px; line-height: 21px; text-indent: 0; text-align: left; font-variant-numeric: lining-nums tabular-nums; }
.page.dx .area .qn, .page.dx .area .gt { right: -216px; } .page.sx .area .qn, .page.sx .area .gt { left: -216px; }
.parola blockquote { margin: 0; }
.parola blockquote p { margin: 0; font-style: italic; color: #555; font-weight: 400; }
/* glossary: the term in the margin */
.area p.g { position: relative; }
.area .gt { font-size: 12px; font-weight: 700; line-height: 21px; hyphens: manual; }
/* notes: smaller, the chapter in the margin */
.note.area { font-size: 12px; line-height: 21px; }
.note.area h3.m { font-size: 12px; line-height: 21px; font-weight: 700; letter-spacing: 0; }

/* chapter openers */
.page.apertura { background: #fff; }
.page svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.page .apnum { position: absolute; z-index: 2; top: 72px; font-variant-numeric: lining-nums tabular-nums; font-weight: 800; font-size: 150px; line-height: .8; letter-spacing: -.05em; }
.page .apt { position: absolute; z-index: 2; bottom: 72px; font-weight: 800; font-size: 96px; line-height: .9; letter-spacing: -.05em; color: #fff; }
.page .rd { color: #c8102e; }
.page.apertura .apnum { left: 72px; color: #111; } .page.apertura .apt { left: 72px; right: 72px; }
.page.splash.sx .apnum { right: auto; left: 72px; }
.page .velo { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.page.splash .velo { background: none; }
/* shade only where the type sits: the bottom-right corner under the title, a small one under the number */
.page.splash .velo.t { background: radial-gradient(ellipse 95% 60% at 100% 100%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 40%, rgba(0,0,0,0) 78%); }
.page.splash .velo.nl { background: radial-gradient(ellipse 50% 40% at 0 0, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 45%, rgba(0,0,0,0) 80%); }
.page.splash .velo.t.nr { background: radial-gradient(ellipse 95% 60% at 100% 100%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 40%, rgba(0,0,0,0) 78%), radial-gradient(ellipse 50% 40% at 100% 0, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 45%, rgba(0,0,0,0) 80%); }
.page.splash .apnum { right: 72px; color: #fff; } .page.splash .apt { right: 72px; left: 72px; text-align: right; }
.page.splash img, .page.doppia img { position: absolute; top: 0; height: 100%; width: 200%; object-fit: cover; }
.page.splash.sx img, .page.doppia.sx img { left: 0; } .page.splash.dx img, .page.doppia.dx img { left: -100%; }
/* essay openers: the ring in white on black, the title on the white mat */
.page.saggio { background: #000; color: #fff; }
.page.saggio .area { inset: 0; overflow: visible; }
.page.saggio .area > p:first-child { position: absolute; top: 48px; left: 72px; margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-indent: 0; text-transform: uppercase; color: #8a8a8a; }
.page.saggio .area > p:first-child em { font-style: normal; }
.page.saggio .area h2 { position: absolute; z-index: 2; left: 72px; right: 72px; bottom: 72px; margin: 0; font-size: 96px; line-height: .9; letter-spacing: -.05em; color: #111; }
.page.saggio .area p.sub { text-align: left; position: absolute; top: 72px; left: 72px; width: 520px; margin: 0; font-size: 13.5px; line-height: 21px; color: #bdbdbd; }

/* other pages */
.page.frontespizio .area { top: auto; bottom: 60px; left: auto; right: 72px; text-align: right; }
.page.frontespizio h1 { font-weight: 800; font-size: 96px; line-height: .9; letter-spacing: -.05em; margin: 0; }
.page.frontespizio h1 + h1 { color: #c8102e; }
.page.frontespizio p { font-weight: 700; font-size: 13.5px; margin: 16px 0 0; }
.page.dedica .area { top: auto; bottom: 60px; left: auto; right: 72px; max-width: 600px; text-align: right; }
.page.dedica h1 { font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -.03em; margin: 0 0 22px; }
.page.dedica p { font-style: italic; font-size: 13.5px; line-height: 21px; color: #333; margin: 0; }
.page.colophon .area { top: auto; bottom: 60px; left: 72px; right: auto; font-size: 12px; line-height: 21px; color: #333; }
.page.colophon .area p { margin: 0; }
.page.colophon .area p:first-child { font-weight: 700; color: #111; }
.page.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.page.figura .area, .page.disegno .area { display: flex; flex-direction: column; justify-content: center; align-items: center; }
.page.figura img, .page.disegno img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.page.neg { background: #000; color: #fff; }
.page.neg .testata { color: #9a9a9a; }
.page.neg.figura img, .page.neg.disegno img, .page.neg.figpiena img, .page.neg img.fondo { filter: invert(1); }
.page img.fondo { position: absolute; left: 0; width: 100%; }
.page.figpiena img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

/* contents: a black spread, the four chapters as a line of time, the page numbers growing like the powers of 4 */
.page.indice { background: #000; color: #fff; }
.page.indice h1 { position: absolute; left: 72px; top: 64px; font-weight: 800; font-size: 20px; margin: 0; }
.page.indice .cn { position: absolute; width: 300px; bottom: 300px; }
.page.indice .cn b { display: block; font-weight: 800; line-height: .8; letter-spacing: -.05em; }
.page.indice .cn i { display: block; font-style: normal; font-weight: 200; font-size: 20px; margin-top: 12px; }
.page.indice .cn sup { font-size: .55em; }
.page.indice .ct { position: absolute; width: 300px; top: 540px; }
.page.indice .r { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.page.indice .r .p { font-variant-numeric: tabular-nums; }
.page.indice .r.c { font-weight: 800; font-size: 20px; line-height: 1.1; letter-spacing: -.02em; margin-bottom: 6px; }
.page.indice .r.c .p { font-size: 12px; font-weight: 600; letter-spacing: 0; }
.page.indice .r.s, .page.indice .r.s2 { font-size: 12px; line-height: 17px; color: #ddd; }
.page.indice .r.s .p, .page.indice .r.s2 .p { color: #888; }
.page.indice .r.s2 { padding-left: 12px; }
.page.indice .gen { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 40px; font-size: 13.5px; font-weight: 600; }
.page.indice .gen span + span { margin-left: 8px; }
.page.indice a { color: inherit; text-decoration: none; }

/* measuring box */
#misura { position: absolute; left: -10000px; top: 0; }

@media print {
  @page { size: 8.5in 8.5in; margin: 0; }
  body { background: #fff; }
  .barra, #stato { display: none !important; }
  .libro { padding: 0; gap: 0; display: block; }
  .spread { display: block; width: auto; height: auto; }
  .spread .fogli { display: block; transform: none; }
  .spread .vuoto { display: none; }
  .spread .page { box-shadow: none; break-after: page; }
  .spread .page.ultima { break-after: auto; }
}
</style>
</head>
<body>
<div class="barra">
  <span class="t">Il Quadrante delle Emozioni</span>
  <span class="info" id="info"></span>
  <select id="vista" aria-label="Vista">
    <option value="doppie">Pagine affiancate</option>
    <option value="singole">Una pagina alla volta</option>
  </select>
  <button id="pdf" type="button">Scarica PDF</button>
  <button id="modifica" type="button">Modifica</button>
</div>
<div id="stato">Impagino il libro…</div>
<div class="libro" id="libro" lang="it"></div>
<div id="misura" lang="it"></div>
<div id="editor" hidden></div>

<script>
'use strict';
// ------------------------------------------------------------------ a small Markdown renderer (the subset Pages CMS writes)
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  // keep raw inline HTML that the editor may write (<em>, <strong>, <br>, <span …>)
  const keep = []; s = s.replace(/<\/?(em|strong|i|b|br|span|sup|sub|u|s)( [^>]*)?\/?>/gi, m => (keep.push(m), `\u0000${keep.length - 1}\u0000`));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, a, u) => `<img src="${u}" alt="${a}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, u) => `<a href="${u}">${t}</a>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_(?!\s)([^_]+?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\\\n/g, '<br>').replace(/ {2,}\n/g, '<br>').replace(/\\([\\`*_{}\[\]()#+\-.!>])/g, '$1');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[i]);
}
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const isBlank = l => !l.trim();
  while (i < lines.length) {
    let l = lines[i];
    if (isBlank(l)) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2].trim())}</h${n}>`; i++; continue; }
    if (/^\s*([*_-])(\s*\1){2,}\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^\s*<(p|div|figure|table|blockquote|ul|ol|h\d)[\s>]/i.test(l)) {      // raw HTML block
      let b = ''; while (i < lines.length && !isBlank(lines[i])) b += lines[i++] + '\n'; out += b; continue;
    }
    if (/^\s*>/.test(l)) {
      let b = []; while (i < lines.length && /^\s*>/.test(lines[i])) b.push(lines[i++].replace(/^\s*>\s?/, ''));
      out += `<blockquote>${markdown(b.join('\n'))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const items = []; let cur = null;
      while (i < lines.length && !isBlank(lines[i])) {
        const x = lines[i], mm = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (mm && mm[1].length < 2) { cur = { t: mm[3], sub: [], ord: /\d/.test(mm[2]) }; items.push(cur); }
        else if (cur && mm) cur.sub.push(x.replace(/^\s{2,4}/, ''));
        else if (cur) cur.t += '\n' + x.trim();
        i++;
        if (i < lines.length && isBlank(lines[i]) && i + 1 < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i + 1])) i++;
      }
      const tag = items[0].ord ? 'ol' : 'ul';
      out += `<${tag}>` + items.map(it => `<li>${inline(it.t)}${it.sub.length ? markdown(it.sub.join('\n')) : ''}</li>`).join('') + `</${tag}>`;
      continue;
    }
    let p = []; while (i < lines.length && !isBlank(lines[i]) && !/^(#{1,6}\s|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) p.push(lines[i++]);
    if (!p.length) { p.push(lines[i++]); }
    const txt = p.join('\n');
    if (/^!\[[^\]]*\]\([^)]+\)$/.test(txt.trim())) out += `<figure>${inline(txt.trim())}</figure>`;
    else out += `<p>${inline(txt)}</p>`;
  }
  return out;
}

// ------------------------------------------------------------------ pagination
const BOOK = 'Quadrante delle emozioni';
const norm = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[*_]/g, '').replace(/\s+/g, ' ').trim();
function roman(n) { const v = [[10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']]; let r = ''; for (const [k, l] of v) while (n >= k) { r += l; n -= k; } return r; }
// the ring, drawn in perspective: the near post on the fold, the ropes going to the far post, the mat below
const R0 = [[199.75, 3], [329.75, 3], [459.75, 3]], RF = [[301.35, .65], [329.95, .65], [358.55, .65]], MN = 606, MF = 390.7, FARX = 730.1, PTOP = 290.6;
function ringSVG(foldRight, ink, mat, dim) {
  const d = foldRight ? -1 : 1, xn = foldRight ? 816 : 0, xf = xn + d * FARX, xe = xn + d * 816;
  const P = (pts, c) => `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${c}"/>`;
  let g = '';
  R0.forEach(([y0, h0], i) => { const [yf, hf] = RF[i];
    g += P([[xn, y0 - h0], [xf, yf - hf], [xf, yf + hf], [xn, y0 + h0]], ink) + P([[xf, yf - hf], [xe, yf - hf], [xe, yf + hf], [xf, yf + hf]], dim); });
  g += `<rect x="${(xf - 1.5).toFixed(1)}" y="${PTOP}" width="3" height="${(MF - PTOP).toFixed(1)}" fill="${ink}"/>`;
  g += `<rect x="${foldRight ? 794 : 0}" y="151" width="22" height="${MN - 151}" fill="${ink}"/>`;
  g += P([[xn, MN], [xf, MF], [xe, MF], [xe, 816], [xn, 816]], mat);
  return `<svg class="ring" viewBox="0 0 816 816" preserveAspectRatio="none">${g}</svg>`;
}
function splitTitle(t) { const m = t.match(/\s(?=(del|dell[’']|della|delle|dei|degli|di)\b|dell[’'])/); return m ? [t.slice(0, m.index), t.slice(m.index + 1)] : [t, '']; }
const RED = /(^|[\s’'])(colore|arte|dolore)(?=$|[\s,.;:])/i;
function fitText(el, maxW, size) { el.style.fontSize = size + 'px'; let k = size; while (k > 30 && el.scrollWidth > maxW + 1) { k -= 2; el.style.fontSize = k + 'px'; } }
const misura = document.getElementById('misura');
let pages = [];                        // {el, kind, cap, folio:boolean, head:boolean}
function newPage(kind, cap, opts = {}) {
  const el = document.createElement('div');
  el.className = 'page ' + kind + (/(^| )neg( |$)/.test(opts.cls || '') ? ' neg' : '');
  const p = { el, kind, cap: cap || '', folio: opts.folio !== false, head: opts.head !== false, cls: opts.cls || '' };
  if (opts.area !== false) { const a = document.createElement('div'); a.className = 'area ' + p.cls; el.appendChild(a); p.area = a; }
  pages.push(p); misura.appendChild(el); side(p);
  return p;
}
function side(p) {                     // page 1 is a right-hand page
  const n = pages.indexOf(p) + 1;

        `<div class="ct" style="left:${X[k % 2]}px">${row('c', e.t, e.page.n)}${subs.map(s => row(s.lv, s.t, s.page.n)).join('')}</div>`;
    };
    ix.el.innerHTML = '<h1>Indice</h1>' + chaps.slice(0, 2).map((c, k) => col(c, k)).join('') + gen(before);
    iq.el.innerHTML = chaps.slice(2, 4).map((c, k) => col(c, k + 2)).join('') + gen(after);
  }
  return pages;
}

// ------------------------------------------------------------------ show
function show() {
  const libro = document.getElementById('libro'); libro.innerHTML = '';
  const singole = document.getElementById('vista').value === 'singole';
  libro.classList.toggle('singole', singole);
  const els = pages.map(p => p.el);
  els.forEach((e, i) => e.classList.toggle('ultima', i === els.length - 1));
  const rows = [];
  if (singole) els.forEach(e => rows.push([e]));
  else { rows.push([null, els[0]]); for (let i = 1; i < els.length; i += 2) rows.push([els[i], els[i + 1] || null]); }
  for (const r of rows) {
    const s = document.createElement('div'); s.className = 'spread';
    const f = document.createElement('div'); f.className = 'fogli'; s.appendChild(f);
    r.forEach(e => { if (e) f.appendChild(e); else { const v = document.createElement('div'); v.className = 'vuoto'; f.appendChild(v); } });
    libro.appendChild(s);
  }
  fit();
}
function fit() {
  const singole = document.getElementById('vista').value === 'singole';
  const box = document.body.classList.contains('editing') ? document.getElementById('libro').clientWidth : window.innerWidth;
  const w = Math.min(box - 32, singole ? 900 : 1700);
  const z = Math.min(1, w / ((singole ? 1 : 2) * 816));
  document.documentElement.style.setProperty('--z', z.toFixed(3));
}
addEventListener('resize', fit);
document.getElementById('vista').addEventListener('change', show);
document.getElementById('pdf').addEventListener('click', () => window.print());

async function impagina(parti, generato) {
  Q.pageOf = {};
  render(parti);
  await Promise.all([...misura.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  show();
  const info = document.getElementById('info');
  info.textContent = `${pages.length} pagine` + (generato ? ` · aggiornato ${new Date(generato).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })}` : '');
  if (avvisi.length) info.insertAdjacentHTML('beforeend', avvisi.map(a => `<span class="avviso">${esc(a)}</span>`).join(''));
}
window.Q = { markdown, impagina, esc, show, fit, pages: () => pages };
async function avvia() {
  const stato = document.getElementById('stato');
  try {
    const r = await fetch('libro.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('libro.json: ' + r.status);
    const libro = await r.json();
    Q.libro = libro;
    await document.fonts.load('12px Inter'); await document.fonts.load('italic 12px Inter'); await document.fonts.load('200 12px Inter');
    await impagina(libro.parti, libro.generato);
    stato.remove();
    document.body.dataset.pronto = '1';
  } catch (e) {
    stato.textContent = 'Non riesco a caricare il libro: ' + e.message;
    console.error(e);
  }
}
avvia();
</script>
